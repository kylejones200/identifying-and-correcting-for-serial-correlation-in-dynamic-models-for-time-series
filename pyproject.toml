[project]
name = "identifying-and-correcting-for-serial-correlation-in-dynamic-models-for-time-ser"
version = "0.1.0"
description = "Companion code for Medium article: identifying and correcting for serial correlation in dynamic models for time series"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "matplotlib>=3.10.9",
    "pandas-datareader>=0.10.0",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
